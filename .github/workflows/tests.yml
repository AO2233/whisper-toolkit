name: Tests
on: [push, pull_request]
jobs:
  tests:
    strategy:
      matrix:
        os: [windows-latest, ubuntu-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.14'
      - run: python -m unittest discover -s sensevoice -p "test_*.py" -v
      - run: python -m unittest discover -s scripts -p "test_*.py" -v
      - run: python scripts/download_models.py --list
      - if: runner.os == 'Linux'
        run: bash -n *.sh
